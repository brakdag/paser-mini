name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ls --all
      - name: Lint, reviewed type baseline and isolated tests
        env:
          HOME: ${{ runner.temp }}/paser-test-home
          PASER_MINI_LOG_LEVEL: "off"
        run: |
          mkdir -p "$HOME"
          npm run check
